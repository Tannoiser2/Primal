# Costruisce la versione web del gioco con Godot e la pubblica su GitHub Pages e, con i segreti
# Cloudflare, sulla ludoteca privata.
# Non parte da sola a ogni modifica: si avvia quando si vuole pubblicare, con Actions → Pubblica →
# Run workflow, oppure con un commit sul ramo main il cui messaggio contiene [pubblica].
# Prima di esportare, tools/alleggerisci_web.py semplifica le miniature e comprime le immagini
# SOLO nella copia dell'azione: il progetto resta a piena qualità per la versione desktop.
name: Pubblica

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pubblica]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un carattere che il font non ha diventa un quadratino: si ferma tutto prima.
      - name: Controlla i glifi dell'interfaccia
        run: |
          pip install --quiet fonttools
          python3 tools/controlla_glifi.py

      - name: Scarica Godot 4.7 e il modello di esportazione web
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.7.stable
          mkdir -p $T
          unzip -q -j Godot_v4.7-stable_export_templates.tpz templates/web_nothreads_release.zip -d $T
          cp $T/web_nothreads_release.zip $T/web_nothreads_debug.zip

      - name: Test delle regole
        run: |
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . scenes/RulesTest.tscn | tee rules.log
          grep -q "tutti i test passati" rules.log

      - name: Alleggerisce modelli 3D e immagini per il browser
        run: python3 tools/alleggerisci_web.py

      - name: Esporta la versione web
        run: |
          mkdir -p build/web
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --import || true
          ./Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.pck
          touch build/web/.nojekyll

      # Ludoteca privata: con i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID pubblica il gioco
      # su https://primal.<dominio>/ protetto da email e codice. Senza segreti non fa nulla.
      - name: Pubblica su Cloudflare (ludoteca privata)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LUDOTECA_DOMINIO: ludoteca-digitale.com
        run: python3 tools/pubblica_cloudflare.py build/web primal primal

      # GitHub Pages solo finché il repository è pubblico
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: build/web

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
